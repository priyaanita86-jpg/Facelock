{% extends "base.html" %}
{% block title %}Password{% endblock %}
{% block content %}
<h2>Face verified</h2>
<p class="ok">Identity confirmed. Enter your password.</p>
<form method="post">
  <input name="password" type="password" placeholder="Password" required autofocus>
  <button type="submit">Log in</button>
</form>
{% if error %}<div class="msg err">{{ error }}</div>{% endif %}
{% endblock %}
