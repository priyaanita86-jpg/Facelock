<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FaceLock{% endblock %}</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>

    <header class="navbar">
        <a href="{{ url_for('login') }}" class="logo">
            <span class="logo-icon">◈</span>
            Face<span>Lock</span>
        </a>

        <div class="nav-label">BIOMETRIC SECURITY</div>
    </header>

    <main class="main-container">
        <div class="card">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        © 2026 FaceLock | Secure Access • Smart Protection
    </footer>

    <script src="{{ url_for('static', filename='camera.js') }}"></script>
    {% block scripts %}{% endblock %}

</body>
</html>
